map $request_id $set_livre_request_id {
    default $request_id;
    "~*^(?<sl_rid_a>[0-9a-f]{8})(?<sl_rid_b>[0-9a-f]{4})[0-9a-f](?<sl_rid_c>[0-9a-f]{3})[0-9a-f](?<sl_rid_d>[0-9a-f]{3})(?<sl_rid_e>[0-9a-f]{12})$" ${sl_rid_a}-${sl_rid_b}-4${sl_rid_c}-8${sl_rid_d}-${sl_rid_e};
}

log_format set_livre_redacted escape=json
    '{"timestamp":"$time_iso8601","status":"$status","requestId":"$set_livre_request_id",'
    '"method":"$request_method","bytesSent":"$body_bytes_sent","requestTime":"$request_time",'
    '"upstreamTime":"$upstream_response_time"}';

error_log /var/log/nginx/set-livre-error.log warn;

map $uri $set_livre_edge_limit_key {
    default "";
    ~^/api/(?:auth/|commands$) $binary_remote_addr;
}

limit_req_zone $set_livre_edge_limit_key zone=set_livre_edge:10m rate=1r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/set-livre-access.log set_livre_redacted;
    add_header X-Request-Id $set_livre_request_id always;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 147.15.97.227;
    access_log /var/log/nginx/set-livre-access.log set_livre_redacted;

    add_header X-Request-Id $set_livre_request_id always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/set-livre-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://147.15.97.227$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/set-livre-access.log set_livre_redacted;
    add_header X-Request-Id $set_livre_request_id always;

    # Clientes de URL por IP não enviam SNI. O handshake padrão precisa apresentar o mesmo
    # certificado para que o Host HTTP possa selecionar o bloco canônico logo abaixo.
    ssl_certificate /etc/letsencrypt/live/147.15.97.227/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/147.15.97.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 147.15.97.227;
    access_log /var/log/nginx/set-livre-access.log set_livre_redacted;

    ssl_certificate /etc/letsencrypt/live/147.15.97.227/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/147.15.97.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16m;
    add_header X-Request-Id $set_livre_request_id always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    limit_req zone=set_livre_edge burst=30 nodelay;
    limit_req_log_level info;
    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $set_livre_request_id;
        proxy_hide_header X-Request-Id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

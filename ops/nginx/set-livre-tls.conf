map $uri $set_livre_edge_limit_key {
    default "";
    ~^/api/(?:auth/|commands$) $binary_remote_addr;
}

limit_req_zone $set_livre_edge_limit_key zone=set_livre_edge:10m rate=1r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 147.15.97.227;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/set-livre-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://147.15.97.227$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Clientes de URL por IP não enviam SNI. O handshake padrão precisa apresentar o mesmo
    # certificado para que o Host HTTP possa selecionar o bloco canônico logo abaixo.
    ssl_certificate /etc/letsencrypt/live/147.15.97.227/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/147.15.97.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 147.15.97.227;

    ssl_certificate /etc/letsencrypt/live/147.15.97.227/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/147.15.97.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    limit_req zone=set_livre_edge burst=30 nodelay;
    limit_req_log_level warn;
    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
